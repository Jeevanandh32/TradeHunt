hostname b-leaf
ip routing
!
vlan 210
   name FEED-B-SUBSCRIBERS
!
interface Ethernet1
   description to b-edge
   no switchport
   ip address 10.2.255.1/31
   ip ospf network point-to-point
   pim ipv4 sparse-mode
!
interface Ethernet2
   description sub1 feed B
   switchport access vlan 210
!
interface Ethernet3
   description sub2 feed B
   switchport access vlan 210
!
interface Vlan210
   description subscriber gateway, IGMP querier
   ip address 10.2.10.1/24
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router ospf 1
   router-id 2.0.0.2
   passive-interface Vlan210
   network 10.2.10.0/24 area 0.0.0.0
   network 10.2.255.0/31 area 0.0.0.0
!
