hostname a-leaf
ip routing
!
vlan 110
   name FEED-A-SUBSCRIBERS
!
interface Ethernet1
   description to a-edge
   no switchport
   ip address 10.1.255.1/31
   ip ospf network point-to-point
   pim ipv4 sparse-mode
!
interface Ethernet2
   description sub1 feed A
   switchport access vlan 110
!
interface Ethernet3
   description sub2 feed A
   switchport access vlan 110
!
interface Vlan110
   description subscriber gateway, IGMP querier
   ip address 10.1.10.1/24
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router ospf 1
   router-id 1.0.0.2
   passive-interface Vlan110
   network 10.1.10.0/24 area 0.0.0.0
   network 10.1.255.0/31 area 0.0.0.0
!
