hostname b-edge
ip routing
!
interface Ethernet1
   description exchange feed B handoff
   no switchport
   ip address 10.2.0.1/24
   pim ipv4 sparse-mode
!
interface Ethernet2
   description to b-leaf
   no switchport
   ip address 10.2.255.0/31
   ip ospf network point-to-point
   pim ipv4 sparse-mode
!
router multicast
   ipv4
      routing
!
router pim sparse-mode
   ipv4
      ssm range standard
!
router ospf 1
   router-id 2.0.0.1
   passive-interface Ethernet1
   network 10.2.0.0/24 area 0.0.0.0
   network 10.2.255.0/31 area 0.0.0.0
!
